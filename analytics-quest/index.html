<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Analytics Quest · Winners</title>
<style>
:root{--ink:#0A1F44;--soft:#4A5B78;--gold:#B07D12;--steel:#E3E8F0;--plate:#F6F8FB}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;padding:16px}
.card{max-width:420px;width:100%;text-align:center;padding:28px 24px;border:1px solid var(--steel);border-radius:16px;background:linear-gradient(180deg,#fff,var(--plate));box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #D5DCE7,0 10px 24px -14px rgba(10,31,68,.35)}
.k{font-family:Consolas,monospace;font-size:11px;letter-spacing:.18em;color:var(--gold)}
h1{margin:6px 0 4px;font-size:24px}h1 span{color:var(--gold)}
p{color:var(--soft);font-size:14px;margin:0 0 18px}
a{display:inline-block;text-decoration:none;color:#fff;font-weight:700;padding:12px 22px;border-radius:10px;border:1px solid #06142E;background:linear-gradient(180deg,#1B3466,#0A1F44 55%,#06142E)}
footer{margin-top:18px;font-size:12px;color:var(--soft)}
</style>
</head>
<body>
<div class="card">
  <div class="k">WINNERS · HR ANALYTICS QUEST</div>
  <h1>رحلة <span>تحليلات</span> الموارد البشرية</h1>
  <p>جاري فتح اللعبة…</p>
  <a id="go" href="#">ادخل اللعبة</a>
  <footer>By: Dr. Saied El Saharty</footer>
</div>
<script>
// يحوّل للعبة على Google Apps Script، ويوصّل كود الجلسة أو شاشة المحاضر لو موجودين في اللينك
var APP="https://script.google.com/macros/s/AKfycbyBy8kqhGhXi4iaGmOZH8sTsAj-MUI9YBRqQm3tWH73DrI-9K_cZuo2p29KKkujHibx/exec";
var q=new URLSearchParams(location.search),out=new URLSearchParams();
if(q.get("s"))out.set("s",q.get("s").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8));
if(q.get("view")==="trainer")out.set("view","trainer");
var url=APP+(out.toString()?"?"+out.toString():"");
document.getElementById("go").href=url;
location.replace(url);
</script>
</body>
</html>
