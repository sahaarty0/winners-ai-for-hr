<!doctype html><html lang="en"><meta charset="utf-8"><title>Premium API smoke test</title><style>body{font:16px system-ui;padding:30px;max-width:740px;margin:auto}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Premium API smoke test</h1><p>This diagnostic sends no email, personal data or registration; it checks only an invalid token.</p><button id="test">Run invalid-token test</button><pre id="out">Not tested yet</pre><script>document.querySelector('#test').onclick=async()=>{let o=document.querySelector('#out');o.textContent='Sending POST...';try{let r=await fetch("https://script.google.com/macros/s/AKfycbySzbmYPBYhcObFykJsAuw2-IXmR-omY22D71trPPsqQ0-7hVwySHWKf1iWYqQkizBp/exec",{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'get_cases',token:'invalid'}),cache:'no-store',redirect:'follow'});let t=await r.text();o.textContent=JSON.stringify({status:r.status,ok:r.ok,body:t.slice(0,500)},null,2)}catch(e){o.textContent='FETCH ERROR: '+String(e)}};</script></html>
